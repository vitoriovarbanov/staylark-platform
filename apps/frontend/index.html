<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staylark</title>
  </head>
  <body>
    <div id="root">
      <style>
        .app-loader{display:flex;align-items:center;justify-content:center;height:100vh;background:#f8f9fa}
        .app-spinner{width:40px;height:40px;border:3px solid #F5DFEC;border-top-color:#963B74;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
      </style>
      <div class="app-loader"><div class="app-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
